# Draws the contribution "snake" eating your commits, refreshed daily, into the `output` branch.
name: Contribution snake
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF6B3D&color_dots=#2a2420,#5a3a26,#a8552f,#e0703d,#ffa24a
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF6B3D&color_dots=#1F1A16,#5a3a26,#a8552f,#e0703d,#ffa24a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
