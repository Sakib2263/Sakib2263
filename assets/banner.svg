<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Sakib Hasan: growth, games and AI tools" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF6B3D"/><stop offset="1" stop-color="#FFA24A"/></linearGradient>
    <linearGradient id="c" x1="0" x2="1"><stop offset="0" stop-color="#7FD6C2"/><stop offset=".6" stop-color="#FFA24A"/><stop offset="1" stop-color="#FF6B3D"/></linearGradient>
    <radialGradient id="glow" cx=".78" cy=".45" r=".5"><stop offset="0" stop-color="#FF6B3D" stop-opacity=".35"/><stop offset="1" stop-color="#14110F" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#F3ECE4" stroke-opacity=".05"/></pattern>
    <clipPath id="r"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif; }
    .name { font-size: 76px; font-weight: 800; letter-spacing: -2px; fill: #F3ECE4; }
    .role { font-size: 26px; font-weight: 600; fill: url(#g); }
    .sub { font-size: 17px; fill: #B8AC9F; }
    .tag { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #7FD6C2; }
    .rise { opacity: 0; animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .curve { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 2.6s ease-in-out .6s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .f1 { animation: f 6s ease-in-out infinite; } .f2 { animation: f 7s ease-in-out -2s infinite; } .f3 { animation: f 5s ease-in-out -1s infinite; } .f4 { animation: f 8s ease-in-out -3s infinite; }
    @keyframes f { 50% { transform: translateY(-14px) rotate(8deg); } }
    .spin { transform-origin: 940px 170px; animation: spin 24s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: b 1s steps(1) infinite; } @keyframes b { 50% { opacity: 0; } }
    .xp { transform-origin: 70px 0; animation: xp 3.6s cubic-bezier(.2,.8,.2,1) 1s infinite; transform: scaleX(.05); }
    @keyframes xp { 0% { transform: scaleX(.05); } 55%, 85% { transform: scaleX(1); } 100% { transform: scaleX(.05); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; } }
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="360" fill="#14110F"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <!-- orbit + game pieces -->
    <g class="spin" opacity=".5"><circle cx="940" cy="170" r="128" fill="none" stroke="#F3ECE4" stroke-opacity=".12" stroke-dasharray="4 10"/><circle cx="1068" cy="170" r="7" fill="#7FD6C2"/><circle cx="812" cy="170" r="5" fill="#FFA24A"/></g>
    <g transform="translate(940 170)">
      <path d="M0-74 64-37v74L0 74-64 37v-74z" fill="#1F1A16" stroke="url(#g)" stroke-width="4"/>
      <text class="t" y="22" text-anchor="middle" font-size="60" font-weight="800" fill="#F3ECE4">SH</text>
    </g>
    <g transform="rotate(14 1110 60)"><g class="f1"><rect x="1093" y="30" width="34" height="34" rx="9" fill="#FF6B3D"/></g></g>
    <g class="f2"><circle cx="820" cy="80" r="16" fill="#7FD6C2"/></g>
    <g class="f3"><path d="M1080 262l16 28h-32z" fill="#FFA24A"/></g>
    <g class="f4"><rect x="800" y="262" width="44" height="18" rx="9" fill="#F3ECE4" opacity=".85"/></g>
    <!-- text -->
    <g class="t">
      <text class="tag rise d1" x="70" y="78">GROWTH · GAMES · AI TOOLS</text>
      <text class="name rise d2" x="64" y="160">Sakib Hasan</text>
      <text class="role rise d3" x="70" y="204">I build growth for apps and games<tspan class="blink" fill="#FF6B3D">_</tspan></text>
      <text class="sub rise d4" x="70" y="240">Growth &amp; Partnership Manager · Borofpani / Softograph · Dhaka</text>
    </g>
    <!-- XP bar -->
    <g transform="translate(0 276)"><g class="rise d4">
      <rect x="70" width="300" height="10" rx="5" fill="#F3ECE4" fill-opacity=".1"/>
      <rect class="xp" x="70" width="300" height="10" rx="5" fill="url(#c)"/>
      <text class="t" x="384" y="10" font-size="13" font-weight="700" fill="#B8AC9F">LVL 6+ · 50+ titles scaled</text>
    </g></g>
    <path class="curve" d="M0 350 C140 345 220 330 330 315 S520 300 600 270 S760 230 820 205" fill="none" stroke="url(#c)" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
